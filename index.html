<style>
/* Стартовая страница и страница-прослойка для ссылок «Поделиться».
   Ровный нейтральный тёмный фон, как у картинок магазина (без зерна и тёплых пятен), один гротеск, акцент только на главной кнопке.
   Справа на стартовой – живая панель расширения (site/panel/, собирается store/src/build-site-panel.js). Отступы кратны 8px. */
:root {
  --bg: var(--c-bg);
  --surface: var(--c-surface);
  --ink: var(--c-ink);
  --soft: var(--c-fg);
  --line: var(--c-surface);
  --accent: var(--c-accent);
  --check: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%3E%3Cpath%20d%3D%27M3%208.5l3%203%207-7%27%20fill%3D%27none%27%20stroke%3D%27%23151515%27%20stroke-width%3D%272.2%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3C%2Fsvg%3E");
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
::selection { background: var(--accent); color: var(--c-on-accent); }
[hidden] { display: none !important; }

html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  color: var(--ink);
  font: 16px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  /* нейтральный тёмный, чуть темнее панели – как фон картинок магазина */
  background-color: #0f0f0f;
}

header, main, footer { width: 100%; max-width: 1120px; margin: 0 auto; padding-inline: 24px; }
header { padding-top: 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.lang { font: inherit; font-size: 14px; color: var(--soft); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
.lang:hover { color: var(--ink); }
.lang:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* слева текст, справа панель расширения */
main { flex: 1; display: flex; align-items: center; gap: clamp(40px, 7vw, 112px); padding-block: 48px; }
.copy { flex: 1; min-width: 0; }
/* у присланного трека панели нет – одна колонка по центру */
.shared header, .shared main, .shared footer { max-width: 720px; text-align: center; }
.shared .copy { display: flex; flex-direction: column; align-items: center; }

/* название – как в панели: тяжёлое, плотное, завалено назад */
.wordmark {
  display: inline-block;
  font-size: 22px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.035em;
  transform: skewX(10deg);
  color: var(--ink);
  text-decoration: none;
}

h1 {
  margin: 0;
  font-size: clamp(30px, 5.4vw, 52px);
  line-height: 1.08;
  font-weight: 800;
  letter-spacing: -.03em;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
/* на стартовой заголовок в две строки, разрыв задан в тексте перевода */
.home h1 { font-size: clamp(38px, 5vw, 60px); line-height: 1.04; white-space: pre-line; }
:lang(ar) h1 { line-height: 1.35; letter-spacing: 0; }
:lang(zh) h1 { letter-spacing: 0; }
.host { margin: 8px 0 0; font-size: 15px; color: var(--soft); overflow-wrap: anywhere; }

/* настройки присланного трека: одна фраза про скорость и тон, эффекты – по раскрытию */
.readout { margin: 24px 0 0; font-size: 20px; line-height: 1.35; font-weight: 500; text-wrap: balance; }
.readout b { font-weight: 800; font-variant-numeric: tabular-nums; }
.fx { margin-top: 8px; font-size: 14px; color: var(--soft); }
.fx summary { display: inline-flex; align-items: center; gap: 8px; min-height: 24px; cursor: pointer; list-style: none; }
.fx summary::-webkit-details-marker { display: none; }
.fx summary:hover { color: var(--ink); }
.fx summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid; border-bottom: 1.5px solid; transform: translateY(-2px) rotate(45deg); transition: transform .2s cubic-bezier(.16, 1, .3, 1); }
.fx[open] summary::after { transform: translateY(1px) rotate(-135deg); }
.fx p { margin: 4px 0 0; }

.lead { margin: 24px 0 0; max-width: 30em; font-size: 17px; color: var(--soft); text-wrap: pretty; }
.home .lead { max-width: 26em; font-size: 18px; }

.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.shared .actions { justify-content: center; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 12px 20px;
  border: 1px solid color-mix(in srgb, var(--c-muted) 55%, var(--bg));
  border-radius: 10px;
  background: none;
  color: var(--ink);
  font: 600 16px/1.25 var(--font);
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}
.btn:hover { border-color: var(--soft); }
/* главное действие страницы – единственное место с акцентным цветом */
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--bg); }
.btn.primary:hover { border-color: var(--c-accent-hover); background: var(--c-accent-hover); }
.btn:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.hint { margin: 16px 0 0; max-width: 34em; font-size: 14px; color: var(--soft); text-wrap: pretty; }
.hint + .hint { margin-top: 8px; }

/* как включить: три шага со значками, как они выглядят на панели Chrome */
.how { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); max-width: 30em; }
.shared .how { margin-inline: auto; text-align: start; }
.how h2 { margin: 0 0 16px; font-size: 15px; font-weight: 700; line-height: 1.25; color: var(--ink); }
.steps { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 24px 1fr; gap: 12px; font-size: 15px; line-height: 24px; color: var(--soft); counter-increment: step; text-wrap: pretty; }
.steps li::before {
  content: counter(step);
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border: 1px solid var(--c-muted);
  border-radius: 50%;
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
/* расширение уже стоит – первый шаг сделан */
.steps li.done::before {
  content: "";
  border-color: var(--accent);
  background: var(--accent) var(--check) center / 14px no-repeat;
}
/* значок на панели браузера: круглая кнопка, как в Chrome */
.key { display: inline-grid; place-items: center; width: 24px; height: 24px; margin-inline: 2px; vertical-align: -7px; border-radius: 50%; background: var(--surface); color: var(--ink); }
.key svg, .key img { display: block; width: 16px; height: 16px; }
.key svg { fill: currentColor; }

/* живая панель расширения – настоящий экземпляр в iframe (site/panel/) */
.shot { position: relative; flex: none; margin: 0; }
/* мягкая тень вокруг панели */
.shot::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 13px;
  background: radial-gradient(90% 90% at 50% 38%, rgba(0, 0, 0, .55) 0%, rgba(0, 0, 0, 0) 72%);
  filter: blur(34px);
  transform: translateY(16px) scale(1.05);
  opacity: .8;
  pointer-events: none;
}
.shot iframe {
  position: relative;
  display: block;
  width: 360px;
  height: 451px;
  max-width: min(360px, 100%);
  border: none;
  border-radius: 13px;
  background: var(--bg);
  box-shadow: 0 22px 48px -20px rgba(0, 0, 0, .55);
}

footer { padding-bottom: 20px; }
.social { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; }
.shared .social { justify-content: center; }
.social a { display: inline-block; padding-block: 12px; color: var(--soft); text-decoration: none; }
.social a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: .25em; }

@media (max-width: 820px) {
  header { padding-top: 24px; }
  main { flex-direction: column; align-items: stretch; gap: 48px; padding-block: 40px; }
  .shot { align-self: center; }
  .home .actions .btn { flex: 1 1 100%; }
}
@media (min-width: 821px) and (max-height: 800px) {
  header { padding-top: 24px; }
  main { padding-block: 16px; }
  .shared h1 { font-size: clamp(30px, 6vh, 52px); }
  .readout { margin-top: 16px; }
  footer { padding-bottom: 12px; }
}

// Язык: ?lang=xx в адресе, затем выбор в переключателе (хранится в браузере),
// затем первый из предпочитаемых в браузере, на который страница переведена; иначе английский.
const preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
let saved = '';
try { saved = localStorage.getItem('screwify-lang') || ''; } catch (e) {}
const asked = new URLSearchParams(location.search).get('lang') || '';
const lang = [asked, saved, ...preferred.map(l => l.toLowerCase().split('-')[0])].find(l => l in TEXT) || 'en';
const t = (key, vars = {}) => TEXT[lang][key].replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
const $ = id => document.getElementById(id);
document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
$('lang').value = lang;
$('lang').addEventListener('change', e => {
  try { localStorage.setItem('screwify-lang', e.target.value); } catch (err) {}
  const url = new URL(location.href);
  url.searchParams.delete('lang');
  history.replaceState(null, '', url);
  location.reload();
});

// ---------- что в ссылке ----------
// #to=<адрес трека с кодом настроек>&track=<исполнитель — название>
// Всё после # браузер на сервер не отправляет.
function readLink() {
  const params = new URLSearchParams(location.hash.slice(1));
  let to;
  try { to = new URL(params.get('to')); } catch (e) { return null; }
  if (!/^https?:$/.test(to.protocol)) return null;
  const code = (to.href.match(/[#?&]screwed=([^&#]*)/) || [])[1] || '';
  const fx = {};
  for (const part of decodeURIComponent(code).split('-')) {
    const m = part.match(/^([sctdwnr])(\d{1,3})$/);
    if (m) fx[m[1]] = Number(m[2]);
  }
  if (!('s' in fx)) return null;
  return {
    to,
    track: (params.get('track') || '').trim().slice(0, 140),
    speed: Math.min(200, Math.max(30, fx.s)),
    chew: Math.min(100, fx.c || 0),
    tone: Math.min(100, fx.t || 0),
    chop: fx.d > 0,
    drift: fx.w > 0,
    noise: Math.min(100, fx.n || 0),
    reverb: Math.min(100, fx.r || 0),
  };
}

// значки панели Chrome: «расширения» (пазл) и «закрепить» (булавка), рисунок как в Chrome
const ICONS = {
  puzzle: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4c-1.1 0-2 .9-2 2v3.8h1.5a2.7 2.7 0 0 1 0 5.4H2V20c0 1.1.9 2 2 2h3.8v-1.5a2.7 2.7 0 0 1 5.4 0V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 9V4h1a1 1 0 0 0 0-2H7a1 1 0 0 0 0 2h1v5a3 3 0 0 1-3 3v2h5.97v7l1 1 1-1v-7H19v-2a3 3 0 0 1-3-3z"/></svg>',
  disc: '<img src="icon.svg" alt="">',
};
const ICON_LABELS = { puzzle: 'iconPuzzle', pin: 'iconPin' };

const knownHost = host => KNOWN_HOSTS.some(h => host === h || host.endsWith('.' + h));

function show(el, text) {
  el.textContent = text;
  el.hidden = false;
}

function showInstall(text) {
  show($('install'), text);
}

// высота тона падает вместе со скоростью, как у пластинки: «замедлен до 78% – тон ниже на 4,3 полутона»
function readoutNodes(speed) {
  if (speed === 100) return [t('normal')];
  const semis = Math.round(Math.abs(12 * Math.log2(speed / 100)) * 10) / 10;
  // число – островком слева направо, чтобы в арабском не перемешалось с текстом
  const n = '⁦' + semis.toLocaleString(lang, { maximumFractionDigits: 1 }) + '⁩';
  const forms = TEXT[lang].semitones;
  const word = typeof forms === 'string' ? forms : forms[new Intl.PluralRules(lang).select(semis)] || forms.other;
  const values = { speed: `${speed}%`, semis: word.replace('{n}', n) };
  return t(speed < 100 ? 'slower' : 'faster').split(/\{(speed|semis)\}/).map((part, i) => {
    if (i % 2 === 0) return part;
    const b = document.createElement('b');
    if (part === 'speed') b.dir = 'ltr';
    b.textContent = values[part];
    return b;
  });
}

const link = readLink();
const ua = navigator.userAgent;
const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
const chromium = /Chrome\//.test(ua);
// расширение помечает эту страницу до запуска её кода (content.js)
const hasExtension = 'screwed' in document.documentElement.dataset;

$('install').href = STORE_URL;

if (link && hasExtension && knownHost(link.to.hostname)) {
  location.replace(link.to.href);
} else if (link) {
  renderShared(link);
} else {
  renderHome();
}

function renderShared({ to, track, speed, chew, tone, chop, drift, noise, reverb }) {
  // чужие ссылки поисковикам не нужны, стартовая – нужна
  const robots = document.createElement('meta');
  robots.name = 'robots';
  robots.content = 'noindex';
  document.head.append(robots);
  document.body.classList.add('shared');

  document.title = `${track || t('untitled')} · ${speed}% – Screwify`;
  $('title').textContent = track || t('untitled');
  show($('host'), to.hostname.replace(/^www\./, ''));

  $('readout').replaceChildren(...readoutNodes(speed));
  $('readout').hidden = false;
  const extras = [chew && t('chew', { n: chew }), tone && t('tone', { n: tone }), drift && t('drift'), noise && t('noise', { n: noise }), reverb && t('reverb', { n: reverb }), chop && t('chop')].filter(Boolean);
  if (extras.length) {
    $('fx-title').textContent = t('effects');
    $('fx-list').textContent = extras.join(' · ');
    $('fx').hidden = false;
  }

  // первая фраза – в какую сторону изменён трек
  const sent = t(speed < 100 ? 'sentSlow' : speed > 100 ? 'sentFast' : 'sentEffects');
  const gap = lang === 'zh' ? '' : ' ';
  $('open').href = to.href;
  if (hasExtension) {
    $('lead').textContent = t('leadHas');
    show($('open'), t('open'));
    $('open').classList.add('primary');
    $('hint').replaceChildren(...richText(t('panelHint')));
    $('hint').hidden = false;
  } else if (mobile) {
    $('lead').textContent = sent + gap + t('mobileTail');
    show($('copy'), t('copy'));
    show($('open'), t('openAsIs'));
    $('copy').addEventListener('click', copyLink);
  } else {
    $('lead').textContent = sent + gap + t('needExt');
    showInstall(t('install'));
    show($('open'), t('open'));
    if (chromium) showSteps('step3Shared');
    else show($('hint'), t('hintOther'));
  }
}

function renderHome() {
  document.body.classList.add('home');
  $('title').textContent = t('line');
  $('lead').textContent = t('leadHome');
  // настоящая панель расширения: живой экземпляр в iframe, язык из адреса
  $('panel').src = `panel/panel.html?lang=${lang}`;
  $('panel').title = t('panelAlt');
  $('panel').addEventListener('load', fitPanel);
  $('shot').hidden = false;
  // расширение уже стоит — кнопка остаётся ссылкой на его страницу в магазине
  showInstall(hasExtension ? t('store') : t('install'));
  show($('trust'), t('trust'));
  if (mobile || !chromium) show($('hint'), t('hintOther'));
  else showSteps('step3');
}

// текст с {puzzle} {pin} {disc} – в узлы, где на месте меток значки
function richText(text) {
  return text.split(/\{(puzzle|pin|disc)\}/).map((part, i) => {
    if (i % 2 === 0) return part;
    const key = document.createElement('span');
    key.className = 'key';
    key.setAttribute('role', 'img');
    key.setAttribute('aria-label', part === 'disc' ? 'Screwify' : t(ICON_LABELS[part]));
    key.innerHTML = ICONS[part];
    return key;
  });
}

// как включить: поставить, закрепить значок, нажать его на сайте с музыкой
function showSteps(last) {
  $('how-title').textContent = t('howTitle');
  $('steps').replaceChildren(...[hasExtension ? 'step1Done' : 'step1', 'step2', last].map((key, i) => {
    const li = document.createElement('li');
    if (i === 0 && hasExtension) li.className = 'done';
    const text = document.createElement('span');
    text.append(...richText(t(key)));
    li.append(text);
    return li;
  }));
  $('how').hidden = false;
}

// Расширение помечает только заново загруженные страницы. Ушли в магазин по кнопке и вернулись –
// перезагружаем: если его поставили, присланный трек откроется сам, а на стартовой первый шаг станет сделанным.
let awaitingInstall = false;
$('install').addEventListener('click', () => { if (!hasExtension) awaitingInstall = true; });
document.addEventListener('visibilitychange', () => {
  if (awaitingInstall && document.visibilityState === 'visible') location.reload();
});

// живая панель: подгоняем высоту iframe под содержимое, чтобы не было прокрутки
function fitPanel() {
  const f = $('panel');
  try {
    const h = f.contentDocument && f.contentDocument.body && f.contentDocument.body.scrollHeight;
    if (h > 0) f.style.height = `${h}px`;
  } catch (e) { /* оставляем высоту из CSS */ }
}
addEventListener('resize', fitPanel);

async function copyLink() {
  const btn = $('copy');
  try {
    await navigator.clipboard.writeText(location.href);
  } catch (e) {
    const area = document.createElement('textarea');
    area.value = location.href;
    area.style.cssText = 'position:fixed;opacity:0';
    document.body.append(area);
    area.select();
    try { document.execCommand('copy'); } catch (err) {}
    area.remove();
  }
  btn.textContent = t('copied');
  setTimeout(() => { btn.textContent = t('copy'); }, 2500);
}

// ссылку поменяли в адресной строке, не перезагружая страницу
addEventListener('hashchange', () => location.reload());
</script>
