<script>
// Ссылки «Поделиться» из расширения ведут сюда (screwify.space/#to=…, в том числе через en/ ru/ zh/ …):
// страница для них теперь живёт в extension/. Перебрасываем до отрисовки, всё после # сохраняется.
// content.js ставит метку установленного расширения только в корне – передаём её как ?ext=1.
(() => {
  if (!/(^#|&)to=/.test(location.hash)) return;
  const q = new URLSearchParams(location.search);
  if ('screwed' in document.documentElement.dataset) q.set('ext', '1');
  // язык отправителя от ru/ zh/ es/ ar/ fr/ (они кладут его сюда, чтобы адрес корня остался чистым)
  try {
    const l = sessionStorage.getItem('screwify-lang');
    sessionStorage.removeItem('screwify-lang');
    if (l && !q.has('lang')) q.set('lang', l);
  } catch (e) {}
  const s = q.toString();
  location.replace('extension/' + (s ? '?' + s : '') + location.hash);
})();
</script>

<style>
/* Главная: все приложения Screwify на одном экране, без прокрутки.
   Цвета – из палитры расширения (extension/panel/palette.css), один гротеск, акцент – только знак и стрелки.
   Отступы кратны 4px. Данные приложений и поддержки – в APPS и SUPPORT ниже. */
:root {
  --bg: #0f0f0f;
  --raise: #1a1a1a;
  --ink: var(--c-ink, #E8E6E0);
  --soft: var(--c-fg, #BDBBB5);
  --muted: var(--c-muted, #8f8c86);
  --accent: var(--c-accent, #EC90A7);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
::selection { background: var(--accent); color: #151515; }
[hidden] { display: none !important; }
/* фон-анимация главной (scenes.js) – под страницей, на весь экран */
.scenes-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
body:has(> .scenes-bg:not([hidden])) { background: transparent; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
header, main, footer { width: 100%; max-width: 760px; margin: 0 auto; padding-inline: 24px; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

header { padding-top: 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.wordmark { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.wordmark img { width: 22px; height: 22px; }
.wordmark span { font-size: 22px; font-weight: 800; line-height: 1; letter-spacing: -.035em; transform: skewX(10deg); }
.lang { font: inherit; font-size: 14px; color: var(--soft); background: transparent; border: 0; border-radius: 8px; padding: 8px 12px; min-height: 40px; margin-inline-end: -12px; cursor: pointer; }
.lang:hover { color: var(--ink); }

main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 40px; overflow-x: clip; /* края повёрнутого веера не дают прокрутки вбок */ }
h1 { margin: 0; font-size: clamp(34px, 6vw, 52px); line-height: 1.04; font-weight: 800; letter-spacing: -.035em; white-space: pre-line; text-wrap: balance; }
.sub { margin: 12px 0 0; color: var(--muted); font-size: 16px; }
:lang(ar) h1 { line-height: 1.3; letter-spacing: 0; }
:lang(zh) h1 { letter-spacing: 0; }

/* приложения – сетка мини-обложек (те же картинки, что Telegram показывает у ссылки).
   Название уже на обложке; платформа – бейджем в углу; описание – на чёрной подложке, которая
   выезжает от начала строки при наведении. Где навести нельзя (сенсорные экраны) – описание под обложкой. */
.apps { list-style: none; margin: clamp(16px, 3.5vh, 36px) 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 2vh, 20px) 16px; }
.app { position: relative; display: block; text-decoration: none; border-radius: 12px; }
.app:focus-visible { outline-offset: 4px; }
.cover {
  position: relative;
  display: block;
  aspect-ratio: 1200 / 630;
  border-radius: 10px;
  overflow: hidden;
  background: var(--raise);
  box-shadow: 0 0 0 1px rgba(255,255,255,.08);
  transition: box-shadow .3s ease;
}
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.badge {
  position: absolute; z-index: 2;
  inset-block-start: 8px; inset-inline-end: 8px;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(0,0,0,.62);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  color: var(--ink);
  font-size: 11px; font-weight: 600; line-height: 1.3; letter-spacing: .01em;
  white-space: nowrap;
}
/* подложка лежит ровно на обложке (она – соседний элемент, чтобы на сенсорных уйти под неё) */
.desc {
  position: absolute; inset-block-start: 0; inset-inline: 0; z-index: 1;
  aspect-ratio: 1200 / 630;
  border-radius: 10px;
  box-sizing: border-box;
  overflow: hidden;
  display: flex; align-items: flex-end;
  margin: 0; padding: 10px 12px;
  background: rgba(0,0,0,.86);
  color: var(--ink);
  font-size: 13px; line-height: 1.35;
  text-wrap: pretty;
  opacity: 0;
  transition: opacity .3s ease;
}
.app:hover .desc, .app:focus-visible .desc { opacity: 1; }
.app:hover .cover, .app.on .cover { box-shadow: 0 0 0 1px rgba(255,255,255,.3); }
.app.soon img { filter: grayscale(.4); opacity: .6; }
.app.soon .badge { color: var(--accent); }
/* с мышью платформа появляется только при наведении – светлой плашкой, хорошо видной на затемнении */
@media (hover: hover) {
  /* платформа появляется чуть позже описания и слегка «всплывает»; исчезает сразу */
  .badge {
    background: var(--ink); color: #151515;
    -webkit-backdrop-filter: none; backdrop-filter: none;
    opacity: 0; transform: translateY(3px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .app.soon .badge { background: var(--accent); color: #151515; }
  .app:hover .badge, .app:focus-visible .badge { opacity: 1; transform: none; transition: opacity .4s ease .22s, transform .5s cubic-bezier(.2,.7,.2,1) .22s; }
  /* линза: обложка за затемнением едва колышется, как через старое стекло (SVG-фильтр #lens, чуть разное
     на каждое наведение), тёплая и приглушённая – главное здесь описание; слабый блик идёт за курсором */
  .cover img { transition: transform .8s cubic-bezier(.2,.7,.2,1); }
  .app.lensing .cover img { filter: url(#lens) sepia(.18) saturate(.85) brightness(.88); transform: scale(1.05); }
  .desc {
    background:
      radial-gradient(circle at var(--mx, 50%) var(--my, 40%), rgba(255, 226, 196, .07), transparent 45%),
      linear-gradient(to top, rgba(12, 9, 7, .94) 0%, rgba(12, 9, 7, .76) 45%, rgba(12, 9, 7, .5) 100%);
    /* размытие обложки под затемнением – браузерное, ровное; проявляется вместе с затемнением */
    -webkit-backdrop-filter: blur(2.5px) saturate(.9); backdrop-filter: blur(2.5px) saturate(.9);
  }
}
@media (hover: none) {
  .desc {
    position: static; aspect-ratio: auto; border-radius: 0;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
    padding: 0; margin-top: 6px; background: none; opacity: 1; transition: none;
    color: var(--muted); font-size: 12px;
  }
}

/* превью выбранного приложения – только на широком экране, справа от списка */
.preview { display: none; }
@media (min-width: 1180px) and (min-height: 600px) {
  header, main, footer { max-width: 1320px; }
  header { padding-top: 20px; }
  /* слева заголовок и две крупные карточки в ряд: ширина колонки – от высоты окна, чтобы три ряда влезли без прокрутки */
  main { display: grid; grid-template-columns: minmax(0, min(600px, calc((100dvh - 390px) / 3 / 0.525 * 2 + 28px))) minmax(0, 1fr); align-items: center; column-gap: clamp(40px, 4vw, 72px); padding-block: 16px; }
  h1 { font-size: clamp(32px, 3.2vw, 44px); }
  .apps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  /* карточки висят над фоном: стеклянная рамка размывает и чуть подсвечивает фон под собой, снизу – тень */
  .app {
    padding: 6px;
    border-radius: 16px;
    background: rgba(255, 236, 214, .035);
    -webkit-backdrop-filter: blur(16px) saturate(1.35); backdrop-filter: blur(16px) saturate(1.35);
    box-shadow: inset 0 1px 0 rgba(255, 240, 225, .08), 0 0 0 1px rgba(255, 236, 214, .06), 0 22px 50px -10px rgba(0, 0, 0, .55);
    transition: background-color .4s ease, box-shadow .4s ease;
  }
  .app:hover, .app.on { background: rgba(255, 236, 214, .07); box-shadow: inset 0 1px 0 rgba(255, 240, 225, .12), 0 0 0 1px rgba(255, 236, 214, .14), 0 26px 60px -10px rgba(0, 0, 0, .6); }
  .cover { box-shadow: none; }
  .app:hover .cover, .app.on .cover { box-shadow: none; }
  .desc { inset-block-start: 6px; inset-inline: 6px; }
  .badge { inset-block-start: 14px; inset-inline-end: 14px; }
  .desc { font-size: 15px; padding: 12px 14px; }
  /* справа – место акцента: сама рамка пустая, анимации (scenes.js) рисуются фоном на весь экран –
     здесь резко, дальше всё размытее и тише */
  .preview {
    display: block;
    position: relative;
    margin: 0;
    aspect-ratio: 16 / 10;
    max-height: calc(100dvh - 200px);
  }
}

footer { padding-bottom: 20px; font-size: 13px; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; align-items: center; gap: 0 20px; }
.links a, .links button { display: inline-block; padding-block: 10px; color: var(--muted); text-decoration: none; font: inherit; background: none; border: 0; cursor: pointer; }
.links a:hover, .links button:hover { color: var(--ink); }
.links .support { color: var(--soft); }
.links .support::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-inline-end: 8px; vertical-align: middle; }
.links .write { color: var(--soft); }
.links .end { margin-inline-start: auto; display: flex; gap: 0 20px; }
.about { margin: 0; font-size: 12px; line-height: 1.5; max-width: 52em; text-wrap: pretty; }
.about a { color: var(--soft); }

/* поддержка – листок поверх страницы */
dialog {
  width: min(440px, calc(100vw - 32px));
  padding: 28px;
  border: 0;
  border-radius: 20px;
  background: #1a1a1a;
  color: var(--ink);
  box-shadow: 0 24px 80px rgba(0,0,0,.6);
}
dialog::backdrop { background: rgba(8,8,8,.72); backdrop-filter: blur(6px); }
dialog h2 { margin: 0; padding-inline-end: 24px; line-height: 1.2; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
dialog p { margin: 10px 0 0; color: var(--soft); font-size: 15px; text-wrap: pretty; }
.costs { list-style: none; margin: 20px 0 0; padding: 0; font-size: 15px; }
.costs li { display: flex; justify-content: space-between; gap: 16px; padding-block: 6px; color: var(--soft); }
.costs li span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter { margin-top: 16px; height: 6px; border-radius: 3px; background: #2a2a2a; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; }
.covered { margin-top: 8px !important; font-size: 13px !important; color: var(--muted) !important; }
.pay { display: grid; gap: 8px; margin-top: 20px; }
.pay a { display: block; text-align: center; padding: 12px 16px; border-radius: 12px; background: #262626; text-decoration: none; font-weight: 600; font-size: 15px; }
.pay a:first-child { background: var(--accent); color: #151515; }
.pay a:hover { filter: brightness(1.08); }
.close { position: absolute; inset-block-start: 12px; inset-inline-end: 12px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
.close:hover { color: var(--ink); background: #262626; }

/* телефон: всё на одном экране даже у 375×667 */
@media (max-width: 560px) {
  header, main, footer { padding-inline: 16px; }
  header { padding-top: 8px; }
  main { padding-block: 8px 12px; }
  h1 { font-size: 29px; }
  .sub { font-size: 14px; margin-top: 6px; }
  .apps { margin-top: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
  .cover { border-radius: 8px; }
  .desc { border-radius: 8px; }
  .badge { inset-block-start: 6px; inset-inline-end: 6px; padding: 2px 7px; font-size: 11px; }
  footer { padding-bottom: 10px; }
  .links { gap: 0 16px; }
  .links a, .links button { padding-block: 6px; }
  .links .end { margin-inline-start: 0; gap: 0 16px; }
  .about { font-size: 11px; }
}
@media (max-height: 800px) and (min-width: 561px) {
  header { padding-top: 14px; }
  main { padding-block: 8px; }
  h1 { font-size: clamp(32px, 5.6vh, 46px); }
  .sub { margin-top: 6px; }
  footer { padding-bottom: 10px; }
  .links a, .links button { padding-block: 6px; }
}
@media (max-height: 640px) and (min-width: 561px) {
  h1 { font-size: 30px; }
  .sub { font-size: 14px; }
  .about { font-size: 11px; }
}
/* сенсорный невысокий экран: описания под обложками – ужимаем всё остальное */
@media (hover: none) and (max-width: 560px) and (max-height: 700px) {
  header { padding-top: 4px; }
  main { padding-block: 4px 8px; }
  h1 { font-size: 25px; }
  .sub { font-size: 13px; margin-top: 4px; }
  .apps { margin-top: 12px; gap: 10px 10px; }
  .desc { font-size: 11px !important; line-height: 1.3; margin-top: 4px !important; }
  .links a, .links button { padding-block: 4px; }
  .about { font-size: 11px; line-height: 1.35; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<!-- линза для наведённой обложки: мягкое широкое смещение, как через старое стекло;
     числа меняет скрипт при каждом наведении (размытие – backdrop-filter у .desc) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="lens" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
    <feTurbulence id="lens-noise" type="fractalNoise" baseFrequency="0.006 0.008" numOctaves="1" seed="1" result="n"/>
    <feDisplacementMap id="lens-disp" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G" result="d"/>
  </filter>
</svg>

<dialog id="sheet" aria-labelledby="s-title">

// Язык – как на странице расширения: ?lang=xx, затем выбор в переключателе (общий ключ), затем браузер.
const preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
let saved = '';
try { saved = localStorage.getItem('screwify-lang') || ''; } catch (e) {}
const asked = new URLSearchParams(location.search).get('lang') || '';
const lang = [asked, saved, ...preferred.map(l => l.toLowerCase().split('-')[0])].find(l => l in TEXT) || 'en';
const t = (key, vars = {}) => TEXT[lang][key].replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
$('lang').value = lang;
$('lang').addEventListener('change', e => {
  try { localStorage.setItem('screwify-lang', e.target.value); } catch (err) {}
  const u = new URL(location.href);
  u.searchParams.delete('lang');
  location.replace(u.href);
});
$('title').textContent = t('title');
$('sub').textContent = t('sub');
$('about').textContent = t('about');
$('privacy-link').textContent = t('privacy');
initFeedback();
$('terms-link').textContent = t('terms');

// картинка на языке страницы; нет такой – английская, нет и её – первая из списка
const pickLang = (dir, langs = []) => `${dir}/${langs.includes(lang) ? lang : langs.includes('en') ? 'en' : langs[0]}.jpg`;

// список приложений
$('apps').replaceChildren(...APPS.map(app => {
  const li = el('li');
  const row = el(app.soon ? 'div' : 'a', 'app' + (app.soon ? ' soon' : ''));
  if (!app.soon) {
    row.href = app.href;
    if (/^https?:/.test(app.href)) row.rel = 'noopener';
  }
  // мини-обложка; описание – во всплывающей подсказке и для экранного диктора
  const cover = el('span', 'cover');
  const img = el('img');
  img.src = pickLang(`covers/${app.id}`, COVERS[app.id]);
  img.alt = '';
  img.decoding = 'async';
  cover.append(img);
  const badge = el('span', 'badge', app.soon ? `${app.tag} · ${t('soon')}` : (app.tag === 'web' ? t('web') : app.tag));
  const desc = el('span', 'desc', t(app.id));
  // бейдж – соседом обложки и подложки, поверх обеих (у поднятой обложки свой слой, внутри неё он ушёл бы под подложку)
  row.append(cover, desc, badge);
  row.setAttribute('aria-label', `${app.name} – ${t(app.id)}`);
  row.dataset.app = app.id;
  li.append(row);
  return li;
}));

// линза на наведённой обложке: едва заметное медленное колыхание и мягкость, каждый раз чуть другие;
// плавно нарастает и уходит. Только с мышью и без «уменьшить движение».
if (matchMedia('(hover: hover)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const noise = $('lens-noise'), disp = $('lens-disp');
  let card = null, raf = 0, amt = 0, goal = 0, p = null, t0 = 0, prev = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const tick = now => {
    const dt = Math.min(0.1, (now - (prev || now)) / 1000);
    prev = now;
    amt += (goal - amt) * (1 - Math.exp(-dt * (goal ? 2 : 3.5)));
    const t = (now - t0) / 1000;
    const fx = p.fx * (1 + 0.12 * Math.sin(t * p.sp)), fy = p.fy * (1 + 0.12 * Math.cos(t * p.sp * 0.8 + 1));
    noise.setAttribute('baseFrequency', `${fx.toFixed(5)} ${fy.toFixed(5)}`);
    disp.setAttribute('scale', (p.scale * amt).toFixed(2));
    if (!goal && amt < 0.01) { card && card.classList.remove('lensing'); card = null; raf = 0; return; }
    raf = requestAnimationFrame(tick);
  };
  for (const r of document.querySelectorAll('.app')) {
    r.addEventListener('mouseenter', () => {
      if (card && card !== r) card.classList.remove('lensing');
      card = r; amt = 0; goal = 1; t0 = performance.now(); prev = 0;
      p = { fx: rnd(0.004, 0.009), fy: rnd(0.005, 0.011), scale: rnd(7, 13), sp: rnd(0.25, 0.5) };
      noise.setAttribute('seed', String(Math.floor(rnd(1, 999))));
      r.classList.add('lensing');
      if (!raf) raf = requestAnimationFrame(tick);
    });
    r.addEventListener('mouseleave', () => { if (card === r) goal = 0; });
    r.addEventListener('mousemove', e => {
      const b = r.getBoundingClientRect();
      r.style.setProperty('--mx', `${((e.clientX - b.left) / b.width * 100).toFixed(1)}%`);
      r.style.setProperty('--my', `${((e.clientY - b.top) / b.height * 100).toFixed(1)}%`);
    });
  }
}

// анимации справа (scenes.js) – только на широком экране; выбранная карточка подсвечена
{
  const wide = matchMedia('(min-width: 1180px) and (min-height: 600px)');
  const rows = [...document.querySelectorAll('.app')];
  let fx = null, current = '';
  const pick = id => {
    if (id === current) return;
    current = id;
    for (const r of rows) r.classList.toggle('on', r.dataset.app === id);
    if (fx) fx.focus(id);
  };
  const sync = () => {
    if (wide.matches && !fx && window.ScrewifyScenes) fx = ScrewifyScenes.mount($('preview'), APPS.map(a => a.id));
    if (!fx) return;
    if (wide.matches) { fx.focus(current); fx.start(); } else fx.stop();
  };
  sync();
  wide.addEventListener('change', sync);
  // мышь, проходящая через карточки по пути, сцену не дёргает: меняем, только если задержалась;
  // ушла с сетки – снова общий туман
  let timer = 0;
  const later = (id, ms) => { clearTimeout(timer); timer = setTimeout(() => pick(id), ms); };
  for (const r of rows) {
    // одна сцена уже выбрана – на соседнюю переключаемся, только если мышь задержалась подольше
    r.addEventListener('mouseenter', () => later(r.dataset.app, current ? 280 : 160));
    r.addEventListener('focus', () => { clearTimeout(timer); pick(r.dataset.app); });
  }
  $('apps').addEventListener('mouseleave', () => later('', 300));
  $('apps').addEventListener('focusout', e => { if (!$('apps').contains(e.relatedTarget)) later('', 300); });
}

// ---------- листок «Поддержать» ----------
const support = new URLSearchParams(location.search).get('support') === 'preview' ? SUPPORT_PREVIEW : SUPPORT;
if (support.links.length) {
  const money = n => new Intl.NumberFormat(document.documentElement.lang, { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);
  const total = support.tools.reduce((s, x) => s + x.usd, 0);
  $('support').textContent = t('support');
  $('support').hidden = false;
  $('s-title').textContent = t('sTitle');
  $('s-lead').textContent = t('sLead');
  $('s-close').setAttribute('aria-label', t('close'));
  $('s-costs').replaceChildren(...support.tools.map(x => {
    const li = el('li');
    li.append(el('span', '', x.name), el('span', '', t('perMonth', { sum: money(x.usd) })));
    return li;
  }));
  const shown = total > 0;
  $('s-meter').parentElement.hidden = !shown;
  $('s-covered').hidden = !shown;
  if (shown) {
    $('s-meter').style.width = `${Math.min(100, support.covered / total * 100)}%`;
    $('s-covered').textContent = t('covered', { covered: money(support.covered), total: money(total) });
  }
  $('s-pay').replaceChildren(...support.links.map(l => {
    const a = el('a', '', l.label);
    a.href = l.href;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  }));
  const sheet = $('sheet');
  $('support').addEventListener('click', () => sheet.showModal());
  $('s-close').addEventListener('click', () => sheet.close());
  // щелчок мимо листка закрывает его (у самого листка поля – тоже dialog, поэтому по координатам)
  sheet.addEventListener('click', e => {
    const r = sheet.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) sheet.close();
  });
}

// ---------- «Написать автору» ----------
// Окно и отправка – feedback.js (копия /Users/Shared/Projects/libs/feedback/src/feedback.js). Сообщение уходит
// в Worker, тот пересылает в Telegram и сам подписывает, откуда оно: «Главная» или «Screwify» по пути страницы.
function initFeedback() {
  if (!window.Feedback) return;
  const fb = Feedback.create({ url: FEEDBACK_URL, lang });
  const btn = $('write');
  btn.textContent = Feedback.TEXTS[lang].title;
  btn.hidden = false;
  btn.addEventListener('click', () => fb.open());
}
</script>
