/* Страница-прослойка для ссылок «Поделиться». Тот же язык, что у панели:
   нейтральная тёмная основа, один акцент, без градиентов и теней. */
:root {
  --bg: #15131a;
  --fg: #ebe8f0;
  --muted: #8f899c;
  --line: #2c2834;
  --panel: #1e1b25;
  --accent: #e8823c;
  --on-accent: #15131a;
  --font: "Helvetica Neue", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  color: var(--fg);
  font: 16px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
}

header, main, footer { width: 100%; max-width: 480px; margin: 0 auto; padding: 0 20px; }
header { padding-top: 20px; }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 28px; padding-bottom: 28px; }
footer { padding-bottom: 24px; }

/* название — как в панели: тяжёлое, плотное, завалено назад */
.wordmark {
  display: inline-block;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.035em;
  transform: skewX(10deg);
  transform-origin: left bottom;
  color: var(--fg);
  text-decoration: none;
}

/* пластинка: диск, две дорожки, этикетка с обложкой или риской */
.platter { width: 184px; height: 184px; }
.record {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  --disc: color-mix(in srgb, var(--bg) 86%, var(--fg));
  --groove: color-mix(in srgb, var(--bg) 70%, var(--fg));
  background:
    radial-gradient(circle closest-side,
      transparent 71%, var(--groove) 71.5% 72.5%, transparent 73%,
      transparent 85%, var(--groove) 85.5% 86.5%, transparent 87%),
    var(--disc);
  animation: spin var(--turn, 2.6s) linear infinite;
}
.label {
  position: absolute;
  inset: 30%;
  border-radius: 50%;
  background: conic-gradient(var(--on-accent) 0 3%, var(--accent) 3% 100%);
}
.label.cover {
  inset: 18%;
  background: var(--cover) center / cover no-repeat, var(--line);
}
.label::after {
  content: "";
  position: absolute;
  inset: 44%;
  border-radius: 50%;
  background: var(--bg);
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .record { animation: none; } }

.eyebrow { margin: 28px 0 0; font-size: 14px; color: var(--muted); }
h1 {
  margin: 6px 0 0;
  font-size: 30px;
  line-height: 1.12;
  font-weight: 700;
  letter-spacing: -.025em;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
/* разрядка рвёт арабскую вязь и не нужна иероглифам */
:lang(ar) h1, :lang(zh) h1 { letter-spacing: 0; }
.host { margin: 8px 0 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }

/* табло — как в панели: крупное число и подпись рядом */
.readout { display: flex; align-items: flex-end; gap: 10px; margin-top: 24px; }
.digits { font-size: 64px; line-height: .9; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.readout-text { display: flex; flex-direction: column; padding-bottom: 3px; font-size: 14px; line-height: 1.3; }
.readout-text span + span { color: var(--muted); }

.lead { margin: 16px 0 0; color: var(--muted); text-wrap: pretty; white-space: pre-line; }

.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 52px;
  padding: 12px 20px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: none;
  color: var(--fg);
  font: 600 16px/1.2 var(--font);
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: background-color .15s;
}
.btn:hover { background: var(--panel); }
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--fg)); }
.btn:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.hint { margin: 12px 0 0; font-size: 14px; color: var(--muted); text-wrap: pretty; }

.about { margin: 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
.about li { padding: 12px 0; border-top: 1px solid var(--line); }
.about b { color: var(--fg); font-weight: 600; }

@media (max-width: 380px) {
  .platter { width: 148px; height: 148px; }
  h1 { font-size: 26px; }
  .digits { font-size: 54px; }
}

// на который страница переведена; иначе английский.
const preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
const lang = preferred.map(l => l.toLowerCase().split('-')[0]).find(l => l in TEXT) || 'en';
const t = (key, vars = {}) => TEXT[lang][key].replace(/\{(\w+)\}/g, (m, k) => vars[k]);
const $ = id => document.getElementById(id);
document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;

// ---------- что в ссылке ----------
// #to=<адрес трека с кодом настроек>&track=<исполнитель — название>
// Всё после # браузер на сервер не отправляет.
function readLink() {
  const params = new URLSearchParams(location.hash.slice(1));
  let to;
  try { to = new URL(params.get('to')); } catch (e) { return null; }
  if (!/^https?:$/.test(to.protocol)) return null;
  const code = (to.href.match(/[#?&]screwed=([^&#]*)/) || [])[1] || '';
  const fx = {};
  for (const part of decodeURIComponent(code).split('-')) {
    const m = part.match(/^([sctd])(\d{1,3})$/);
    if (m) fx[m[1]] = Number(m[2]);
  }
  if (!('s' in fx)) return null;
  return {
    to,
    track: (params.get('track') || '').trim().slice(0, 140),
    speed: Math.min(120, Math.max(30, fx.s)),
    chew: Math.min(100, fx.c || 0),
    tone: Math.min(100, fx.t || 0),
    chop: fx.d > 0,
  };
}

const knownHost = host => KNOWN_HOSTS.some(h => host === h || host.endsWith('.' + h));

function youtubeId(u) {
  const host = u.hostname.replace(/^(www|m|music)\./, '');
  const id = host === 'youtu.be' ? u.pathname.slice(1)
    : host === 'youtube.com' ? u.searchParams.get('v') || (u.pathname.match(/^\/(?:shorts|embed|live)\/([^/]+)/) || [])[1]
    : null;
  return id && /^[\w-]{6,20}$/.test(id) ? id : null;
}

function show(el, text) {
  el.textContent = text;
  el.hidden = false;
}

// расширение помечает эту страницу до запуска её кода (content.js)
const hasExtension = 'screwed' in document.documentElement.dataset;

$('brand').textContent = 'Screwed Music';
for (const n of [1, 2, 3]) $('about-' + n).innerHTML = t('about' + n);
$('install').href = STORE_URL;

if (link && hasExtension && knownHost(link.to.hostname)) {
  location.replace(link.to.href);
} else if (link) {
  renderShared(link);
} else {
  renderHome();
}

function renderShared({ to, track, speed, chew, tone, chop }) {
  document.title = `${track || t('untitled')} · ${speed}% – Screwed Music`;
  $('eyebrow').textContent = t('sent');
  $('title').textContent = track || t('untitled');
  show($('host'), to.hostname.replace(/^www\./, ''));

  // пластинка крутится с той же скоростью, что и трек: 33⅓ оборота в минуту на 100%
  $('record').style.setProperty('--turn', `${(1.8 / (speed / 100)).toFixed(2)}s`);
  const yt = youtubeId(to);
  if (yt) {
    const img = new Image();
    img.referrerPolicy = 'no-referrer';
    img.onload = () => {
      $('label').style.setProperty('--cover', `url("${img.src}")`);
      $('label').classList.add('cover');
    };
    img.src = `https://i.ytimg.com/vi/${yt}/hqdefault.jpg`;
  }

  const semis = 12 * Math.log2(speed / 100);
  // число со знаком — островком слева направо, чтобы в арабском минус не уезжал за цифры
  const n = '\u2066' + (semis > 0 ? '+' : semis < 0 ? '−' : '') + Math.abs(semis).toLocaleString(lang, { maximumFractionDigits: 1 }) + '\u2069';
  $('readout').hidden = false;
  $('digits').textContent = `${speed}%`;
  $('semitones').textContent = t('semitones', { n });
  $('extras').textContent = [chew && t('chew', { n: chew }), tone && t('tone', { n: tone }), chop && t('chop')].filter(Boolean).join(' · ');

  $('open').href = to.href;
  if (hasExtension) {
    $('lead').textContent = t('leadHas');
    show($('open'), t('open'));
    $('open').classList.add('primary');
  } else if (mobile) {
    $('lead').textContent = t('leadMobile');
    show($('copy'), t('copy'));
    show($('open'), t('openAsIs'));
    $('copy').addEventListener('click', copyLink);
  } else {
    $('lead').textContent = t('leadShared');
    show($('install'), t('install'));
    show($('open'), t('open'));
    show($('hint'), chromium ? t('hintAfter') : t('hintOther'));
  }
}

function renderHome() {
  $('eyebrow').textContent = t('homeEyebrow');
  $('title').textContent = t('homeTitle');
  $('lead').textContent = t('leadHome');
  // расширение уже стоит — кнопка остаётся ссылкой на его страницу в магазине
  show($('install'), hasExtension ? t('store') : t('install'));
  if (mobile || !chromium) show($('hint'), t('hintOther'));
}

async function copyLink() {
  const btn = $('copy');
  try {
    await navigator.clipboard.writeText(location.href);
  } catch (e) {
    const area = document.createElement('textarea');
    area.value = location.href;
    area.style.cssText = 'position:fixed;opacity:0';
    document.body.append(area);
    area.select();
    try { document.execCommand('copy'); } catch (err) {}
    area.remove();
  }
  btn.textContent = t('copied');
  setTimeout(() => { btn.textContent = t('copy'); }, 2500);
}

// ссылку поменяли в адресной строке, не перезагружая страницу
addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
